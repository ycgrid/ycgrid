# Every member of the model, accounted for (scripts/check_model_fields.py, run by check_all and tests.test_core).
#
# saved: each member of Sheet and Workbook, and how it is kept in a .ycg file.
#   ycg              the round trip (tests/unit/test_model_roundtrip.cpp) compares it after a save and an open
#   elsewhere FILE   kept another way, checked in FILE
#   transient WHY    not saved, and why
#
# references: each field of a model struct that may name cells (a text, a rectangle, a cell), and what keeps it right
# when cells move, sheets are renamed, deleted or copied.
#   text             a reference list walks it (src/model/ref_texts.h), and test_ref_registry.cpp has its slot
#   rect FILE        the structure operations move it (document_struct.cpp / document_data.cpp), checked in FILE
#   key              a cell position kept as a map key (notes, hyperlinks): it moves with its cell
#   kept WHY         names cells but stays as it is, as in Excel (measured)
#   none WHY         not a reference
#
# A new member or field fails the check until it has a line here: decide, and give it the test its kind asks for.

