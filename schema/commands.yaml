# Every UI command (CommandRegistry id) and its Python entry points (PLAN §13.5a: anything the UI can do, Python can do).
#
#   Id: Entry[, Entry...]
#
# An entry is an object model member (Range.Font.Bold, Application.Undo, Chart.SetElement), a yc module function
# (yc.safety.kill), a built-in pane (ui.pane("watch")) or, for commands that only drive the UI itself, ExecuteMso.
# Every command can also be run by id: yc.ui.command(id) / Application.CommandBars.ExecuteMso(id).
# Ids ending in * cover the commands made in a loop (ChartType0, ChartType1...).
#
# scripts/check_commands.py fails when a registered command is missing here or an entry doesn't exist in yc, and
# writes skill/ycgrid-python/references/ui-coverage.md from this file.

