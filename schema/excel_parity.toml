# Excel's object model against YCGrid's Python members.
#
# Every member Excel's type library lists for the objects below (tests/data/excel_object_model.json, measured by
# scripts/measure_excel_object_model.py from EXCEL.EXE) is one of three things:
#   - a member of the YCGrid classes named for its object (found by scripts/check_excel_parity.py in python/yc);
#   - in [[not_planned]], under a reason (the decisions of docs/excel-parity-backlog.md, "Not planned");
#   - in [[gap]], open, with a priority:
#       high    Python lacks what YCGrid's own UI does, or a ported macro sets it in its first lines and stops there
#               (Application raises on a member it doesn't know);
#       medium  a File > Options item, or a member macros commonly read or set;
#       low     the rest.
# scripts/check_excel_parity.py fails on a member in none of them, and on one listed here that YCGrid now has: the
# gaps only shrink. `--write` regenerates docs/excel-object-model.md from this file. "*.Name" means every object.
# Settings in File > Options are members of Application, Workbook, Worksheet and Window, so they are counted here too.

[objects]
Application = { tlb = "_Application", yc = ["excel._Application"] }
Workbook = { tlb = "_Workbook", yc = ["excel.Workbook"] }
Workbooks = { tlb = "Workbooks", yc = ["excel._Workbooks"] }
Worksheet = { tlb = "_Worksheet", yc = ["excel.Worksheet"] }
Sheets = { tlb = "Sheets", yc = ["excel._Worksheets"] }
