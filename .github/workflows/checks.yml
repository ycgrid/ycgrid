name: checks

# The fast checks that need no build, on every push and pull request: translations, UI command coverage, the
# open-source boundary (files and history) and the Python tests that run without YCGrid. The full build and the UI
# checks are scripts\check_all.cmd on a developer machine, and the build workflow (started by hand).
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Packages of YCGrid's Python runtime
        run: python -m pip install -r python/requirements-runtime.txt

      - name: Translations
        run: python scripts/i18n_build.py check

      - name: UI command coverage
        run: python scripts/check_commands.py

      - name: Boundary (tracked files and history)
        run: python scripts/check_boundary.py --history HEAD

      - name: Python tests that need no running YCGrid
        working-directory: python
        run: python -m unittest tests.test_core tests.test_mcp tests.test_data tests.test_plot tests.test_analysis tests.test_pure
